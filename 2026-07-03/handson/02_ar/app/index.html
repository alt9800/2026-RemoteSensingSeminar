<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>最小描画テスト</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
  html, body { margin:0; height:100%; background:#000; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  a-scene, a-scene canvas.a-canvas {
    position:fixed !important; inset:0 !important;
    width:100% !important; height:100% !important; z-index:1 !important;
  }
  #msg { position:fixed; top:0; left:0; right:0; z-index:10;
    font:12px/1.5 ui-monospace,monospace; background:rgba(248,250,251,.85); padding:6px 10px; }
  #go { position:fixed; left:16px; bottom:24px; z-index:10;
    font:16px system-ui,sans-serif; padding:12px 18px; background:#fff; color:#111;
    border:1.5px solid #111; border-radius:2px; }
</style>
</head>
<body>
<video id="cam" playsinline autoplay muted></video>
<div id="msg">最小描画テスト：赤い箱（正面）と緑の箱（前方）が出れば描画OK</div>

<a-scene vr-mode-ui="enabled: false" loading-screen="enabled: false" renderer="alpha: true">
  <a-camera position="0 1.6 0" look-controls-enabled="false" wasd-controls-enabled="false">
    <a-box position="0 0 -2" scale="0.5 0.5 0.5" material="shader: flat; color: #FF3B30"></a-box>
  </a-camera>
  <a-box position="0 1 -3" material="shader: flat; color: #34C759"></a-box>
</a-scene>

<button id="go">カメラ開始</button>

<script>
  document.getElementById("go").addEventListener("click", function () {
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
      .then(function (s) {
        var v = document.getElementById("cam"); v.srcObject = s; v.play();
        document.getElementById("msg").textContent = "カメラOK：赤い箱（正面）と緑の箱が見えますか？";
      })
      .catch(function (e) { document.getElementById("msg").textContent = "カメラ失敗: " + e.name; });
  });
</script>
</body>
</html>

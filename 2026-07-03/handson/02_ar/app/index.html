<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>カメラ単体テスト</title>
<style>
  :root { --ink:#1A1A1A; --sub:#6B7280; --line:#C9CDD2; --warn:#B91C1C; --ok:#2D7D46; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; color:var(--ink);
    font-family:"BIZ UDPGothic","Hiragino Sans",system-ui,sans-serif; }
  h1 { font-size:1.1rem; margin:0 0 6px; }
  p { font-size:.85rem; color:var(--sub); line-height:1.6; margin:0 0 14px; }
  button { font:inherit; width:100%; padding:12px 18px; background:#fff; color:var(--ink);
    border:1.5px solid var(--ink); border-radius:2px; cursor:pointer; }
  button:active { background:#F8FAFB; }
  #status { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.8rem;
    margin:14px 0; }
  #status.ok  { color:var(--ok); }
  #status.ng  { color:var(--warn); }
  #info { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.72rem; color:var(--sub); }
  video { width:100%; margin-top:14px; border:1px solid var(--line); background:#000;
    display:block; }
</style>
</head>
<body>
  <h1>カメラ単体テスト</h1>
  <p>AR.js を使わず、getUserMedia だけでカメラが映るかを確認します。ここで映れば、映像取得自体は問題なく、原因は AR.js 側だと切り分けられます。</p>

  <button id="go">カメラ開始</button>
  <p id="status">未開始</p>
  <video id="v" playsinline autoplay muted></video>
  <p id="info"></p>

<script>
  function setStatus(text, cls) {
    var s = document.getElementById("status");
    s.textContent = text; s.className = cls || "";
  }

  document.getElementById("go").addEventListener("click", function () {
    setStatus("要求中…");

    if (!window.isSecureContext) {
      setStatus("Secure Context ではありません（HTTPS が必要）", "ng");
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("この端末は getUserMedia に対応していません", "ng");
      return;
    }

    // 背面カメラを希望（取れなければ既定のカメラにフォールバック）
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
      .then(attach)
      .catch(function (err1) {
        // 背面指定で失敗した場合、指定なしで再試行する
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
          .then(attach)
          .catch(function (err2) {
            setStatus("失敗: " + err2.name + " — " + err2.message, "ng");
          });
      });
  });

  function attach(stream) {
    var v = document.getElementById("v");
    v.srcObject = stream;
    var play = v.play();
    var done = function () {
      setStatus("カメラ OK", "ok");
      var track = stream.getVideoTracks()[0];
      document.getElementById("info").textContent =
        "トラック: " + (track ? track.label : "不明") +
        " / 解像度: " + v.videoWidth + "x" + v.videoHeight;
    };
    if (play && play.then) { play.then(done).catch(function (e) {
      setStatus("再生に失敗: " + e.name + " — " + e.message, "ng");
    }); } else { done(); }
  }
</script>
</body>
</html>

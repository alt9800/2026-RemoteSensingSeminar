<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>権限テスト（カメラ・GPS・方位）</title>
<style>
  :root { --ink:#1A1A1A; --sub:#6B7280; --line:#C9CDD2; --ok:#2D7D46; --ng:#B91C1C; }
  * { box-sizing:border-box; }
  body { margin:0; padding:20px; color:var(--ink);
    font-family:"BIZ UDPGothic","Hiragino Sans",system-ui,sans-serif; }
  h1 { font-size:1.1rem; margin:0 0 6px; }
  p { font-size:.85rem; color:var(--sub); line-height:1.6; margin:0 0 14px; }
  button { font:inherit; width:100%; padding:12px 18px; background:#fff; color:var(--ink);
    border:1.5px solid var(--ink); border-radius:2px; cursor:pointer; }
  button:active { background:#F8FAFB; }
  .row { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.8rem; margin:12px 0; }
  .row.ok { color:var(--ok); }
  .row.ng { color:var(--ng); }
  video { width:100%; margin-top:14px; border:1px solid var(--line); background:#000; display:block; }
</style>
</head>
<body>
  <h1>権限テスト（カメラ・GPS・方位）</h1>
  <p>3つの許可を1回のタップでまとめて要求し、それぞれの結果を表示します。どれが許可され、どれが失敗するかを確認します。</p>
  <button id="go">3つの許可をテスト</button>

  <div class="row" id="r-orient">方位: —</div>
  <div class="row" id="r-cam">カメラ: —</div>
  <div class="row" id="r-gps">GPS: —</div>
  <video id="v" playsinline autoplay muted></video>

<script>
  function set(id, text, ok) {
    var e = document.getElementById(id);
    e.textContent = text;
    e.className = "row" + (ok === true ? " ok" : ok === false ? " ng" : "");
  }

  document.getElementById("go").addEventListener("click", function () {
    // 1) 方位（iOS はタップ内で requestPermission が必須）
    var DO = window.DeviceOrientationEvent;
    if (DO && typeof DO.requestPermission === "function") {
      DO.requestPermission().then(function (res) {
        set("r-orient", "方位: requestPermission = " + res, res === "granted");
        if (res === "granted") {
          window.addEventListener("deviceorientation", function h(ev) {
            set("r-orient", "方位: OK (alpha " + (ev.alpha != null ? ev.alpha.toFixed(0) : "null") + ")", true);
            window.removeEventListener("deviceorientation", h);
          });
        }
      }).catch(function (e) { set("r-orient", "方位: 失敗 " + e, false); });
    } else {
      set("r-orient", "方位: 許可不要（イベント待ち）");
      window.addEventListener("deviceorientation", function h(ev) {
        set("r-orient", "方位: OK (alpha " + (ev.alpha != null ? ev.alpha.toFixed(0) : "null") + ")", true);
        window.removeEventListener("deviceorientation", h);
      });
    }

    // 2) カメラ
    set("r-cam", "カメラ: 要求中…");
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
        .then(function (stream) {
          var v = document.getElementById("v");
          v.srcObject = stream; v.play();
          set("r-cam", "カメラ: OK", true);
        })
        .catch(function (e) { set("r-cam", "カメラ: 失敗 " + e.name + " — " + e.message, false); });
    } else {
      set("r-cam", "カメラ: getUserMedia 非対応", false);
    }

    // 3) GPS
    set("r-gps", "GPS: 要求中…");
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          var c = pos.coords;
          set("r-gps", "GPS: OK " + c.latitude.toFixed(5) + ", " + c.longitude.toFixed(5) + " (±" + Math.round(c.accuracy) + "m)", true);
        },
        function (err) { set("r-gps", "GPS: 失敗 " + err.code + " — " + err.message, false); },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    } else {
      set("r-gps", "GPS: geolocation 非対応", false);
    }
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>切り分け：arjs-device-orientation-controls有無テスト</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
<style>
  html, body { margin:0; height:100%; background:#000; }
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  a-scene { position:fixed; inset:0; width:100%; height:100%; z-index:1; }

  #hud {
    position:fixed; top:0; left:0; right:0; z-index:10;
    font:12px/1.6 ui-monospace,monospace; background:rgba(248,250,251,.92); padding:8px 10px;
  }
  #log {
    position:fixed; left:0; right:0; bottom:0; z-index:10;
    max-height:35vh; overflow-y:auto;
    font:11px/1.5 ui-monospace,monospace; background:rgba(255,255,255,.95);
    border-top:1px solid #C9CDD2; padding:6px 8px;
  }
  #log div { color:#B91C1C; word-break:break-all; margin:2px 0; }
  #log div.info { color:#1A1A1A; }

  #controls {
    position:fixed; left:16px; right:16px; bottom:calc(35vh + 12px); z-index:11;
    display:flex; flex-wrap:wrap; gap:8px;
  }
  button {
    font:14px system-ui,sans-serif; padding:10px 14px; background:#fff; color:#111;
    border:1.5px solid #111; border-radius:2px; flex:1 1 auto; min-width:120px;
  }
  button:disabled { opacity:.4; }

  @media (max-width:380px) {
    #hud { font-size:11px; padding:6px 8px; }
    #log { font-size:10px; max-height:32vh; }
    button { font-size:13px; padding:8px 10px; min-width:100px; }
  }
</style>
</head>
<body>
<video id="cam" playsinline autoplay muted></video>

<div id="hud">
  実行中: <span id="mode">未選択</span>
</div>

<div id="controls">
  <button id="run-a">A: 方位コンポーネント付きで開始</button>
  <button id="run-b">B: 方位コンポーネントなしで開始</button>
  <button id="eruda">詳細コンソールを開く</button>
</div>

<div id="log"></div>

<script>
  // 画面上に直接エラーを表示する。実機接続なしで確認するための仕組み。
  var logEl = document.getElementById("log");
  function logLine(text, isInfo) {
    var d = document.createElement("div");
    if (isInfo) d.className = "info";
    d.textContent = text;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }
  window.onerror = function (msg, src, line, col) {
    logLine("エラー: " + msg + " (" + line + ":" + col + ")");
  };
  window.addEventListener("unhandledrejection", function (e) {
    logLine("Promiseエラー: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });

  document.getElementById("eruda").addEventListener("click", function () {
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/eruda";
    s.onload = function () { eruda.init(); logLine("erudaを起動した", true); };
    s.onerror = function () { logLine("eruda読み込み失敗（通信できない可能性）"); };
    document.body.appendChild(s);
  });

  var sceneEl = null;

  function run(withOrientation) {
    document.getElementById("run-a").disabled = true;
    document.getElementById("run-b").disabled = true;
    document.getElementById("mode").textContent = withOrientation ? "A（付与あり）" : "B（付与なし）";

    var DO = window.DeviceOrientationEvent;
    if (DO && typeof DO.requestPermission === "function") {
      DO.requestPermission().then(function (r) {
        logLine("方位パーミッション: " + r, true);
      }).catch(function (e) { logLine("方位パーミッションエラー: " + e); });
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
      .then(function (stream) {
        var v = document.getElementById("cam");
        v.srcObject = stream; v.play();
        logLine("カメラ起動OK", true);

        if (sceneEl) { sceneEl.remove(); } // 前回のシーンが残っていれば除去する

        var scene = document.createElement("a-scene");
        scene.setAttribute("vr-mode-ui", "enabled: false");
        scene.setAttribute("loading-screen", "enabled: false");
        scene.setAttribute("embedded", "");
        scene.setAttribute("renderer", "alpha: true");

        var cam = document.createElement("a-camera");
        cam.setAttribute("position", "0 1.6 0");
        cam.setAttribute("look-controls-enabled", "false");
        cam.setAttribute("wasd-controls-enabled", "false");

        if (withOrientation) {
          cam.setAttribute("arjs-device-orientation-controls", "smoothingFactor: 0.1");
          logLine("arjs-device-orientation-controls を付与", true);
        } else {
          logLine("arjs-device-orientation-controls は付与しない", true);
        }

        var probeRed = document.createElement("a-box");
        probeRed.setAttribute("position", "0 0 -2");
        probeRed.setAttribute("scale", "0.5 0.5 0.5");
        probeRed.setAttribute("material", "shader: flat; color: #FF3B30");
        cam.appendChild(probeRed);
        scene.appendChild(cam);

        var probeGreen = document.createElement("a-box");
        probeGreen.setAttribute("position", "0 1 -3");
        probeGreen.setAttribute("material", "shader: flat; color: #34C759");
        scene.appendChild(probeGreen);

        scene.addEventListener("renderstart", function () { logLine("a-scene renderstart 発火", true); });

        document.body.appendChild(scene);
        sceneEl = scene;
      })
      .catch(function (e) {
        logLine("カメラ不可: " + (e.name || e));
      })
      .finally(function () {
        document.getElementById("run-a").disabled = false;
        document.getElementById("run-b").disabled = false;
      });
  }

  document.getElementById("run-a").addEventListener("click", function () { run(true); });
  document.getElementById("run-b").addEventListener("click", function () { run(false); });
</script>
</body>
</html>

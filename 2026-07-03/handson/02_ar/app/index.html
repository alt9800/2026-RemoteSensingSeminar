<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>農地レイヤーAR（筆ポリゴン・半径250m）</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

<style>
  :root {
    --ink:#1A1A1A; --sub:#6B7280; --line:#C9CDD2; --accent:#2D7D46;
    --bg:#FFFFFF; --panel:#F8FAFB; --warn:#B91C1C;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { font-family:"BIZ UDPGothic","Hiragino Sans",system-ui,sans-serif; color:var(--ink); }

  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; z-index:0; }
  a-scene { position:fixed; inset:0; width:100%; height:100%; z-index:1; }

  #overlay {
    position:fixed; inset:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto;
  }
  #overlay .card { width:100%; max-width:420px; border:1px solid var(--line); padding:24px; }
  #overlay h1 { font-size:1.1rem; margin:0 0 10px; }
  #overlay p { font-size:.85rem; color:var(--sub); margin:0 0 12px; line-height:1.6; }
  #overlay label { display:block; font-size:.82rem; margin:0 0 6px; }
  #geojson-file { font-size:.8rem; width:100%; margin:0 0 16px; }
  #radius-row { display:flex; align-items:center; gap:8px; margin:0 0 16px; }
  #radius-row input { width:80px; font:inherit; padding:6px; border:1px solid var(--line); }
  #start { font:inherit; width:100%; padding:12px 18px; background:var(--bg); color:var(--ink);
    border:1.5px solid var(--ink); border-radius:2px; cursor:pointer; }

  #hud {
    position:fixed; top:0; left:0; right:0; z-index:15;
    font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.72rem; line-height:1.5;
    color:var(--ink); background:rgba(248,250,251,.85); padding:6px 10px; border-bottom:1px solid var(--line);
    word-break:break-all;
  }
  #hud .err { color:var(--warn); }

  @media (max-width:380px) {
    #overlay .card { max-width:100%; padding:18px; }
    #hud { font-size:.66rem; padding:5px 8px; }
  }
</style>
</head>
<body>

<video id="cam" playsinline autoplay muted></video>

<div id="hud">
  <span id="hud-cam">カメラ: —</span> ·
  <span id="hud-gps">GPS: —</span> ·
  <span id="hud-data">表示: —</span>
  <span id="hud-err" class="err"></span>
</div>

<div id="overlay">
  <div class="card">
    <h1>農地レイヤーAR（筆ポリゴン・半径250m）</h1>
    <p>筆ポリゴンから変換したGeoJSONを読み込み、現在地から半径250m以内の筆だけを輪郭線として表示します。押し出し（立ち上げ）は行いません。</p>

    <label for="geojson-file">GeoJSONファイル（指定がなければ ./ube.geojson を読み込む）</label>
    <input type="file" id="geojson-file" accept=".geojson,.json,application/geo+json,application/json">

    <div id="radius-row">
      <label for="radius" style="margin:0;">表示半径(m)</label>
      <input type="number" id="radius" value="250" min="10" step="10">
    </div>

    <button id="start">開始</button>
  </div>
</div>

<script>
  function setCam(t){ document.getElementById("hud-cam").textContent = "カメラ: " + t; }
  function setGps(t){ document.getElementById("hud-gps").textContent = "GPS: " + t; }
  function setData(t){ document.getElementById("hud-data").textContent = "表示: " + t; }
  function setErr(t){ document.getElementById("hud-err").textContent = t ? ("  " + t) : ""; }

  var userPos = null;          // { lat, lon }
  var allFeatures = null;      // GeoJSONのfeatures全件（フィルタ前）
  var placedEntities = [];     // { el, lat, lon }
  var filtered = false;        // 250m絞り込みを一度実行したか
  var radiusM = 250;

  function calcOffset(lat, lon, uLat, uLon) {
    var mLat = 110574;
    var mLon = 111320 * Math.cos(uLat * Math.PI / 180);
    var north = (lat - uLat) * mLat;
    var east  = (lon - uLon) * mLon;
    return { x: east, z: -north, dist: Math.sqrt(east*east + north*north) };
  }

  function updatePositions() {
    if (!userPos) return;
    placedEntities.forEach(function (item) {
      var off = calcOffset(item.lat, item.lon, userPos.lat, userPos.lon);
      item.el.setAttribute("position", off.x.toFixed(2) + " 0 " + off.z.toFixed(2));
    });
  }

  // ---- 筆の輪郭線のみを描画するコンポーネント（押し出しなし） ----
  // vertsは代表点(point_lat/point_lng)からの相対オフセット[east, north]の配列。
  AFRAME.registerComponent("parcel-outline", {
    schema: {
      verts: { type: "string" },
      color: { type: "string", default: "#2D7D46" }
    },
    init: function () {
      var pts = JSON.parse(this.data.verts);
      var arr = [];
      pts.forEach(function (p) { arr.push(p[0], 0, -p[1]); });
      arr.push(pts[0][0], 0, -pts[0][1]); // 始点に戻して閉じる

      var geom = new THREE.BufferGeometry();
      geom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(arr), 3));
      var mat = new THREE.LineBasicMaterial({ color: this.data.color });
      this.el.setObject3D("outline", new THREE.Line(geom, mat));
    }
  });

  AFRAME.registerComponent("face-camera", {
    tick: function () {
      var cam = this.el.sceneEl && this.el.sceneEl.camera;
      if (!cam) return;
      var camPos = new THREE.Vector3(); cam.getWorldPosition(camPos);
      var myPos  = new THREE.Vector3(); this.el.object3D.getWorldPosition(myPos);
      camPos.y = myPos.y;
      this.el.object3D.lookAt(camPos);
    }
  });

  function makeLabel(uuid) {
    var card = document.createElement("a-entity");
    card.setAttribute("position", "0 1.2 0");
    card.setAttribute("face-camera", "");
    var plane = document.createElement("a-plane");
    plane.setAttribute("material", "shader: flat; color: #F8FAFB; opacity: 0.9");
    plane.setAttribute("width", "16"); plane.setAttribute("height", "1.6");
    var t = document.createElement("a-text");
    t.setAttribute("value", uuid);
    t.setAttribute("align", "center");
    t.setAttribute("color", "#111111");
    t.setAttribute("width", "30"); // 長いuuidを収めるため文字を小さめにする
    t.setAttribute("position", "0 0 0.05");
    card.appendChild(plane); card.appendChild(t);
    return card;
  }

  function addParcel(scene, ring, anchorLat, anchorLon, uuid) {
    var pts = ring.slice(0, ring.length - 1);
    var mLat = 110574, mLon = 111320 * Math.cos(anchorLat * Math.PI / 180);
    var localVerts = pts.map(function (c) {
      var north = (c[1] - anchorLat) * mLat;
      var east  = (c[0] - anchorLon) * mLon;
      return [east, north];
    });

    var wrap = document.createElement("a-entity");
    wrap.setAttribute("parcel-outline", { verts: JSON.stringify(localVerts), color: "#2D7D46" });
    wrap.appendChild(makeLabel(uuid));
    scene.appendChild(wrap);
    placedEntities.push({ el: wrap, lat: anchorLat, lon: anchorLon });
  }

  // ---- 現在地から半径radiusM以内の筆だけを抽出して描画する ----
  function applyRadiusFilter(scene) {
    if (!userPos || !allFeatures || filtered) return;
    filtered = true;

    var matched = 0;
    var minDist = null;
    allFeatures.forEach(function (f) {
      var p = f.properties || {};
      var lat = p.point_lat, lon = p.point_lng;
      if (lat == null || lon == null) return;
      var off = calcOffset(lat, lon, userPos.lat, userPos.lon);
      if (minDist == null || off.dist < minDist) minDist = off.dist;
      if (off.dist > radiusM) return;
      if (!f.geometry || f.geometry.type !== "Polygon") return;

      addParcel(scene, f.geometry.coordinates[0], lat, lon, p.name || p.polygon_uuid || "(不明)");
      matched++;
    });

    var summary = matched + " 件（全" + allFeatures.length + "件中、半径" + radiusM + "m）";
    if (matched === 0 && minDist != null) {
      summary += " / 最短" + Math.round(minDist) + "m（範囲外）";
    }
    setData(summary);
    updatePositions();
  }

  function loadGeojsonFromFile(file) {
    var reader = new FileReader();
    reader.onload = function (e) {
      try {
        var gj = JSON.parse(e.target.result);
        allFeatures = gj.features || [];
        setData("GeoJSON読込済み（" + allFeatures.length + "件）。GPS取得待ち");
      } catch (err) {
        setErr("GeoJSON解析エラー: " + err);
      }
    };
    reader.readAsText(file);
  }

  function loadGeojsonFromUrl(url) {
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (gj) {
        allFeatures = gj.features || [];
        setData("GeoJSON読込済み（" + allFeatures.length + "件）。GPS取得待ち");
      })
      .catch(function (e) { setErr("GeoJSON読込エラー: " + e); });
  }

  function buildOverlay(scene) {
    var cam = document.createElement("a-camera");
    cam.setAttribute("position", "0 1.6 0");
    cam.setAttribute("look-controls-enabled", "false");
    cam.setAttribute("wasd-controls-enabled", "false");
    cam.setAttribute("arjs-device-orientation-controls", "smoothingFactor: 0.1");
    scene.appendChild(cam);
  }

  function startCamera() {
    return navigator.mediaDevices
      .getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
      .then(function (stream) {
        var v = document.getElementById("cam");
        v.srcObject = stream;
        var play = v.play();
        setCam("起動");
        return play && play.then ? play.catch(function(){}) : null;
      });
  }

  document.getElementById("start").addEventListener("click", function () {
    var fileInput = document.getElementById("geojson-file");
    var selectedFile = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
    radiusM = parseFloat(document.getElementById("radius").value) || 250;

    setCam("要求中");
    var DO = window.DeviceOrientationEvent, DM = window.DeviceMotionEvent;
    if (DO && typeof DO.requestPermission === "function") DO.requestPermission().catch(function(){});
    if (DM && typeof DM.requestPermission === "function") DM.requestPermission().catch(function(){});

    startCamera()
      .then(function () {
        document.getElementById("overlay").style.display = "none";

        var scene = document.createElement("a-scene");
        scene.setAttribute("vr-mode-ui", "enabled: false");
        scene.setAttribute("loading-screen", "enabled: false");
        scene.setAttribute("embedded", "");
        scene.setAttribute("renderer", "alpha: true; antialias: true");
        buildOverlay(scene);
        document.body.appendChild(scene);

        if (selectedFile) loadGeojsonFromFile(selectedFile);
        else loadGeojsonFromUrl("./ube.geojson");

        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(
            function (pos) {
              var c = pos.coords;
              userPos = { lat: c.latitude, lon: c.longitude };
              setGps(c.latitude.toFixed(6) + ", " + c.longitude.toFixed(6) + " (\u00b1" + Math.round(c.accuracy) + "m)");
              applyRadiusFilter(scene); // 最初の取得時に一度だけ絞り込みを行う
              updatePositions();
            },
            function (err) { setErr("GPSエラー: " + err.code + " " + err.message); },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
          );
        }
      })
      .catch(function (e) {
        setErr("カメラ不可: " + (e.name || e));
      });
  });
</script>
</body>
</html>

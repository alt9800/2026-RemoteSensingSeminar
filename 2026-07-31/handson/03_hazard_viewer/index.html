<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ハザードビューア（地形 + NDWI + 防災重点溜池）</title>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute;
      bottom: 24px; left: 8px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px 12px;
      font-family: sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      max-width: min(320px, calc(100vw - 32px));
    }
    #panel h1 { font-size: 14px; margin: 0 0 6px; }
    #panel .row { margin: 4px 0; }
    #panel label { display: flex; align-items: center; gap: 6px; }
    #panel input[type="range"] { flex: 1; min-width: 100px; }
    @media (max-width: 480px) {
      #panel { font-size: 12px; padding: 6px 8px; left: 8px; right: 8px; max-width: none; }
    }
  </style>
</head>
<body>
  <div id="panel">
    <h1>地形 + NDWI + 防災重点溜池</h1>
    <div class="row">
      <label>垂直誇張 <input type="range" id="exag" min="0" max="3" step="0.1" value="1.5">
        <span id="exag-label">1.5</span></label>
    </div>
    <div class="row">
      <label>NDWI不透明度 <input type="range" id="op" min="0" max="1" step="0.05" value="0.6">
        <span id="op-label">0.6</span></label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="terrain-toggle" checked> 3D地形</label>
      <label><input type="checkbox" id="loc-toggle"> 現在位置を追従</label>
    </div>
  </div>
  <div id="map"></div>

  <script>
    // ── 設定 ─────────────────────────────────────────────
    const TERRAIN_URL = "pmtiles://../terrain_composite_ube_yamaguchi.pmtiles";
    const NDWI_TILES  = "../ndwi/{z}/{x}/{y}.png";
    const TAMEIKE_URL = "../tameike.geojson";
    const CENTER = [131.28, 33.98];
    const ZOOM = 12;
    const MINZOOM = 8;    // pmtiles show の実際の値に合わせる
    const MAXZOOM = 17;
    // ─────────────────────────────────────────────────────

    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const map = new maplibregl.Map({
      container: "map",
      center: CENTER,
      zoom: ZOOM,
      pitch: 55,
      maxPitch: 85,
      style: {
        version: 8,
        sources: {
          gsi_pale: {
            type: "raster",
            tiles: ["https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png"],
            tileSize: 256,
            maxzoom: 18,
            attribution: "地理院タイル / 国土数値情報 / Sentinel-2"
          },
          terrainSource: {
            type: "raster-dem",
            url: TERRAIN_URL,
            encoding: "mapbox",
            tileSize: 256,
            minzoom: MINZOOM,
            maxzoom: MAXZOOM
          },
          ndwi: {
            type: "raster",
            tiles: [NDWI_TILES],
            tileSize: 256,
            minzoom: 10,
            maxzoom: 14
          },
          tameike: { type: "geojson", data: TAMEIKE_URL }
        },
        layers: [
          { id: "base", type: "raster", source: "gsi_pale" },
          {
            id: "hillshade", type: "hillshade", source: "terrainSource",
            paint: { "hillshade-exaggeration": 0.5 }
          },
          {
            id: "ndwi-layer", type: "raster", source: "ndwi",
            paint: { "raster-opacity": 0.6 }
          },
          {
            id: "tameike-pt", type: "circle", source: "tameike",
            paint: {
              "circle-radius": 6,
              "circle-color": "#B91C1C",
              "circle-stroke-color": "#ffffff",
              "circle-stroke-width": 1.5
            }
          }
        ]
      }
    });

    map.addControl(new maplibregl.NavigationControl(), "top-right");

    map.on("load", () => {
      map.setTerrain({ source: "terrainSource", exaggeration: 1.5 });
    });

    // ── 溜池ポップアップ ─────────────────────────────────
    map.on("click", "tameike-pt", (e) => {
      const p = e.features[0].properties;
      new maplibregl.Popup()
        .setLngLat(e.lngLat)
        .setHTML(
          `<strong>${p.name ?? "(名称不明)"}</strong><br>` +
          `堤高: ${p.height ?? "-"} m<br>貯水量: ${p.volume ?? "-"} m³`
        )
        .addTo(map);
    });
    map.on("mouseenter", "tameike-pt", () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", "tameike-pt", () => map.getCanvas().style.cursor = "");

    // ── UI ───────────────────────────────────────────────
    const exag = document.getElementById("exag");
    exag.addEventListener("input", () => {
      document.getElementById("exag-label").textContent = exag.value;
      if (document.getElementById("terrain-toggle").checked) {
        map.setTerrain({ source: "terrainSource", exaggeration: Number(exag.value) });
      }
    });
    const op = document.getElementById("op");
    op.addEventListener("input", () => {
      document.getElementById("op-label").textContent = op.value;
      map.setPaintProperty("ndwi-layer", "raster-opacity", Number(op.value));
    });
    document.getElementById("terrain-toggle").addEventListener("change", (e) => {
      map.setTerrain(e.target.checked
        ? { source: "terrainSource", exaggeration: Number(exag.value) }
        : null);
    });

    // ── 現在位置の追従（第3回の復習）────────────────────
    let watchId = null;
    let marker = null;
    document.getElementById("loc-toggle").addEventListener("change", (e) => {
      if (e.target.checked) {
        watchId = navigator.geolocation.watchPosition((pos) => {
          const lngLat = [pos.coords.longitude, pos.coords.latitude];
          if (!marker) {
            marker = new maplibregl.Marker({ color: "#028090" }).setLngLat(lngLat).addTo(map);
          } else {
            marker.setLngLat(lngLat);
          }
        }, (err) => {
          alert("位置情報の取得に失敗: " + err.message);
          e.target.checked = false;
        }, { enableHighAccuracy: true });
      } else if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        if (marker) { marker.remove(); marker = null; }
      }
    });
  </script>
</body>
</html>
